services:
  - type: web
    name: librechat
    runtime: docker
    repo: https://github.com/danny-avila/LibreChat # Thay bằng repo của bạn nếu fork
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: ./
    envVars:
      # MongoDB
      - key: MONGO_URI
        value: mongodb+srv://thyychii2863_db_user:0pmSs4d1WUooNVGq@cluster0.ah1bpbl.mongodb.net/LibreChat
      
      # Server Config
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 3080
      
      # Domain
      - key: DOMAIN_CLIENT
        sync: false
      - key: DOMAIN_SERVER
        sync: false
      
      # Session & Auth (auto-generated)
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CREDS_KEY
        generateValue: true
      - key: CREDS_IV
        generateValue: true
      
      # Endpoints - cho phép user tự cung cấp API keys
      - key: OPENAI_API_KEY
        value: user_provided
      - key: ANTHROPIC_API_KEY
        value: user_provided
      - key: GOOGLE_KEY
        value: user_provided
      
      # UI
      - key: APP_TITLE
        value: LibreChat
      - key: HELP_AND_FAQ_URL
        value: https://librechat.ai
      
      # Security
      - key: ALLOW_EMAIL_LOGIN
        value: true
      - key: ALLOW_REGISTRATION
        value: true
      - key: ALLOW_SOCIAL_LOGIN
        value: false
      - key: ALLOW_UNVERIFIED_EMAIL_LOGIN
        value: true
      
      # Debug
      - key: DEBUG_LOGGING
        value: false
      - key: CONSOLE_JSON
        value: true
